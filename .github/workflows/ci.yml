name: CI/CD

on:
  push:
    branches: [main, main2]
  pull_request:
    branches: [main, main2]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npm run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            **/*.test.ts

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm run security:audit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, security]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run prebuild (self-host assets)
        run: node scripts/self-host-assets.mjs

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: .next/
          retention-days: 7

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main2'
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: .next/

      - name: Run prebuild
        run: node scripts/self-host-assets.mjs

      - name: Deploy to staging
        run: |
          echo "Deploying to staging..."
          # Option 1: SSH deploy to staging server
          # ssh deploy@staging.example.com "cd /opt/taskmind && git pull && npm ci && npm run build && pm2 restart taskmind"
          #
          # Option 2: Docker deploy
          # docker build -t taskmind-staging .
          # docker push ghcr.io/$GITHUB_REPOSITORY:staging
          # docker-compose -f docker-compose.staging.yml up -d
          #
          # Option 3: Railway/Fly.io/Vercel
          # railway up --service staging
          # fly deploy --app taskmind-staging
          #
          echo "Staging deployment placeholder - configure your deployment target"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://taskmind.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: .next/

      - name: Run prebuild
        run: node scripts/self-host-assets.mjs

      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # Option 1: SSH deploy to production server
          # ssh deploy@prod.example.com "cd /opt/taskmind && git pull && npm ci && npm run build && pm2 restart taskmind"
          #
          # Option 2: Docker deploy
          # docker build -t taskmind:latest -t taskmind:$GITHUB_SHA .
          # docker push ghcr.io/$GITHUB_REPOSITORY:latest
          # docker push ghcr.io/$GITHUB_REPOSITORY:$GITHUB_SHA
          # ssh deploy@prod.example.com "docker pull ghcr.io/$GITHUB_REPOSITORY:latest && docker-compose up -d"
          #
          # Option 3: Railway/Fly.io/Vercel
          # railway up --service production
          # fly deploy --app taskmind
          #
          echo "Production deployment placeholder - configure your deployment target"

      - name: Notify deployment
        if: success()
        run: |
          echo "Production deployment successful"
          # Option 1: Slack notification
          # curl -X POST $SLACK_WEBHOOK_URL -H 'Content-type: application/json' -d '{"text":"TaskMind deployed to production: $GITHUB_SHA"}'
          #
          # Option 2: Discord webhook
          # curl -X POST $DISCORD_WEBHOOK_URL -H 'Content-type: application/json' -d '{"content":"TaskMind production deploy: $GITHUB_SHA"}'
